name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mdn-event-management

env:
  # `prisma generate` reads prisma.config.ts, which expects a URL. Nothing
  # connects to it: unit tests mock the Prisma client.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mdn-event-management/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mdn-event-management/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mdn-event-management/package-lock.json
      - run: npm ci
      - run: npm run format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mdn-event-management/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # github-actions reporter annotates failing tests on the PR diff.
      - run: npx vitest run --reporter=default --reporter=github-actions
